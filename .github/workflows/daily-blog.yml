name: Publish the day's blog

on:
  schedule:
    # 07:00 in Asia/Kolkata
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/sai-laptop-site-f2f4
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: node scripts/publish-due-blogs.mjs

      - name: Save today's article on the source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html public/sitemap.xml README.md
          if git diff --cached --quiet; then
            echo "The blog index already includes every article that is due."
          else
            git commit -m "Publish today's laptop repair article."
            git push origin HEAD:cursor/sai-laptop-site-f2f4
          fi

      - run: npm run build
      - run: cp dist/index.html dist/404.html

      - name: Publish the built site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: sailaptopservice.in
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Publish today's laptop repair article."
